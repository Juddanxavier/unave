# The production stack for Dokploy.
#
# This is the same stack as `docker-compose.yml` (Postgres, a one shot
# migration, the app) with two Dokploy specific differences: the app carries the
# Traefik labels that give `unave.in` its HTTPS certificate, and it joins
# Dokploy's network instead of publishing a port, because the Dokploy dashboard
# itself owns the host's port 3000.
#
# In Dokploy, create a Compose service, point it at this repository and set the
# compose path to this file, then add the environment listed in docs/deploy.md.
# Traefik issues the certificate on the first deploy.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-unave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=50
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://unave.in}
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-unave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unave}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
    command: ['pnpm', 'payload', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://unave.in}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # The database lives on this network, so the URL the app sees is told
      # again here, whatever DATABASE_URL says in .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-unave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unave}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://unave.in}
      NODE_ENV: production
    volumes:
      - media:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/globals/header >/dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.unave.rule=Host(`unave.in`) || Host(`www.unave.in`)'
      - 'traefik.http.routers.unave.entrypoints=websecure'
      - 'traefik.http.routers.unave.tls.certresolver=letsencrypt'
      - 'traefik.http.services.unave.loadbalancer.server.port=3000'

volumes:
  pgdata:
  media:

networks:
  dokploy-network:
    external: true
